# GitHub Actions Workflows for Playwright Testing
# Save these in .github/workflows/ directory

# ============================================================================
# Example 1: Basic Playwright Tests
# File: .github/workflows/playwright-basic.yml
# ============================================================================

name: Playwright Tests - Basic

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright
        playwright install --with-deps chromium

    - name: Run Playwright tests
      run: pytest --video=retain-on-failure --tracing=retain-on-failure

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-results
        path: test-results/
        retention-days: 30

# ============================================================================
# Example 2: With Frontend App Server
# File: .github/workflows/playwright-with-server.yml
# ============================================================================

---
name: Playwright Tests - With Dev Server

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Build frontend
      run: npm run build
      working-directory: ./frontend

    - name: Start development server
      run: |
        npm run dev &
        npx wait-on http://localhost:3000 -t 60000
      working-directory: ./frontend

    - name: Run Playwright tests
      run: pytest --base-url=http://localhost:3000
      env:
        CI: true

    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-videos
        path: videos/
        retention-days: 30

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-screenshots
        path: screenshots/
        retention-days: 30

    - name: Upload traces
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-traces
        path: traces/
        retention-days: 30

# ============================================================================
# Example 3: Multi-Browser Testing (Matrix)
# File: .github/workflows/playwright-matrix.yml
# ============================================================================

---
name: Playwright Tests - Multi-Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        exclude:
          # WebKit on Linux can be unstable
          - os: ubuntu-latest
            browser: webkit

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browser
      run: playwright install --with-deps ${{ matrix.browser }}

    - name: Run tests on ${{ matrix.browser }}
      run: pytest --browser ${{ matrix.browser }}

    - name: Upload results - ${{ matrix.os }} - ${{ matrix.browser }}
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results-${{ matrix.os }}-${{ matrix.browser }}
        path: test-results/
        retention-days: 30

# ============================================================================
# Example 4: Using Docker Container
# File: .github/workflows/playwright-docker.yml
# ============================================================================

---
name: Playwright Tests - Docker

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/python:v1.54.0-noble
      options: --user 1001

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest --video=on --tracing=on

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-docker-results
        path: test-results/
        retention-days: 30

# ============================================================================
# Example 5: With Deployment Testing
# File: .github/workflows/playwright-deployment.yml
# ============================================================================

---
name: Playwright Tests - After Deployment

on:
  deployment_status:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # Only run on successful deployments
    if: github.event.deployment_status.state == 'success'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run smoke tests
      run: pytest -m smoke --video=on
      env:
        PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: deployment-test-results
        path: test-results/

    - name: Comment PR with results
      if: github.event.deployment_status.state == 'success'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Playwright tests passed on deployment!'
          });

# ============================================================================
# Example 6: Schedule Periodic Tests
# File: .github/workflows/playwright-scheduled.yml
# ============================================================================

---
name: Playwright Tests - Scheduled

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps

    - name: Run full test suite
      run: pytest --browser chromium --browser firefox --browser webkit

    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scheduled-test-results-${{ github.run_number }}
        path: test-results/

    - name: Send notification on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Scheduled Playwright Tests Failed',
            body: `Scheduled tests failed on ${new Date().toISOString()}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            labels: ['bug', 'automated-test']
          });

# ============================================================================
# Example 7: Upload Videos to GitHub Release
# File: .github/workflows/playwright-release.yml
# ============================================================================

---
name: Playwright Tests - Release with Videos

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-and-release:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run tests with video recording
      run: pytest --video=on

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload test videos to release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          videos/*.webm
          test-results/**/*.png
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================================
# Example 8: Parallel Testing with Sharding
# File: .github/workflows/playwright-parallel.yml
# ============================================================================

---
name: Playwright Tests - Parallel (Sharded)

on:
  push:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-xdist
        playwright install --with-deps chromium

    - name: Run tests (shard ${{ matrix.shard }}/4)
      run: |
        pytest --splits 4 --group ${{ matrix.shard }} --video=retain-on-failure

    - name: Upload shard results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-shard-${{ matrix.shard }}
        path: test-results/
        retention-days: 30

# ============================================================================
# Example 9: With Cloud Storage Upload (AWS S3)
# File: .github/workflows/playwright-s3.yml
# ============================================================================

---
name: Playwright Tests - Upload to S3

on:
  push:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install boto3
        playwright install --with-deps chromium

    - name: Run tests
      run: pytest --video=on

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Upload videos to S3
      run: |
        aws s3 sync videos/ s3://my-test-results-bucket/videos/${{ github.run_number }}/ \
          --acl public-read \
          --content-type "video/webm"

    - name: Upload screenshots to S3
      run: |
        aws s3 sync screenshots/ s3://my-test-results-bucket/screenshots/${{ github.run_number }}/ \
          --acl public-read \
          --content-type "image/png"

    - name: Comment with S3 links
      uses: actions/github-script@v7
      with:
        script: |
          const runNumber = context.runNumber;
          const body = `## Test Results

          📹 Videos: https://my-test-results-bucket.s3.amazonaws.com/videos/${runNumber}/
          📸 Screenshots: https://my-test-results-bucket.s3.amazonaws.com/screenshots/${runNumber}/
          `;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

# ============================================================================
# Example 10: Complete CI/CD Pipeline
# File: .github/workflows/playwright-complete.yml
# ============================================================================

---
name: Complete CI/CD Pipeline with Playwright

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Lint Python
      run: |
        pip install flake8 black
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check .

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Run unit tests
      run: |
        pip install pytest pytest-cov
        pytest tests/unit/ --cov=src --cov-report=xml
    - name: Upload coverage
      uses: codecov/codecov-action@v3

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test-unit]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium
        npm ci

    - name: Start application
      run: |
        npm run dev &
        npx wait-on http://localhost:3000 -t 60000

    - name: Run E2E tests
      run: pytest --video=retain-on-failure --tracing=retain-on-failure

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          test-results/
          videos/
          screenshots/
          traces/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test-e2e]
    if: github.ref == 'refs/heads/main'

