# Pytest configuration for Playwright tests
# Place this file in your project root

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Shorter traceback format
    --tb=short
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Show local variables in tracebacks
    -l

# Playwright-specific options (uncomment as needed)
# Browser selection
# --browser chromium
# --browser firefox
# --browser webkit

# Video recording
# --video on                    # Record all tests
# --video retain-on-failure     # Record only failures (recommended for CI)
# --video off                   # No recording (default)

# Tracing (for debugging)
# --tracing on                  # Enable tracing for all tests
# --tracing retain-on-failure   # Enable tracing only for failures
# --tracing off                 # No tracing (default)

# Browser display mode
# --headed                      # Run with browser UI visible
# --slowmo 100                  # Slow down operations by N milliseconds

# Device emulation
# --device "iPhone 12"          # Emulate specific device

# Base URL
# --base-url http://localhost:3000

# Browser channel (for branded browsers)
# --browser-channel chrome
# --browser-channel msedge

# Parallel execution (requires pytest-xdist)
# -n auto                       # Use all CPU cores
# -n 4                          # Use 4 workers

# Test markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    smoke: marks tests as smoke tests
    login: marks tests that require authentication
    e2e: marks tests as end-to-end tests
    skip_browser: skip test on specific browser
    only_browser: run test only on specific browser

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output directory
# junit_family = xunit2

# Coverage options (if using pytest-cov)
# addopts = --cov=src --cov-report=html --cov-report=term

# Timeout (in seconds) - requires pytest-timeout
# timeout = 300

# Warnings
filterwarnings =
    # Treat warnings as errors (optional)
    # error
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum Python version
minversion = 3.8

# Console output
console_output_style = progress

# Test collection
norecursedirs = .git .tox dist build *.egg node_modules

# Examples of command-line usage:
#
# Basic:
#   pytest                                    # Run all tests
#   pytest tests/test_login.py                # Run specific file
#   pytest tests/test_login.py::test_success  # Run specific test
#
# With video:
#   pytest --video on                         # Record all
#   pytest --video retain-on-failure          # Record failures only
#
# With tracing:
#   pytest --tracing on                       # Enable tracing
#
# Browser selection:
#   pytest --browser webkit                   # Run on WebKit
#   pytest --browser chromium --browser firefox  # Run on multiple browsers
#
# Headed mode:
#   pytest --headed                           # See browser
#   pytest --headed --slowmo 500              # Slow motion
#
# Markers:
#   pytest -m smoke                           # Run smoke tests only
#   pytest -m "not slow"                      # Skip slow tests
#
# Parallel:
#   pytest -n auto                            # Use all CPUs
#
# With base URL:
#   pytest --base-url http://staging.example.com
#
# Debug mode:
#   PWDEBUG=1 pytest                          # Open Playwright Inspector
